name: Aiiku availability notification

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "通知なしの読み取りテスト（最初はチェックあり）"
        required: true
        type: boolean
        default: true

      test_notification:
        description: "LINEテスト通知を送る（dry_runを外した場合のみ）"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aiiku-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check rooms and notify
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python monitor.py

      - name: Save baseline and latest log
        if: always()
        run: |
          if [ ! -d state ]; then
            echo "No state directory to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state/

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update availability and latest log"
            git push
          fi
